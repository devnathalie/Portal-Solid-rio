    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #92bce1;
        }

        .cartao {
            background-color: #f8f2f7;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            max-width: 800px;
            padding: 20px;
        }

        .cabecalho {
            text-align: center;
            margin-bottom: 20px;
        }

        .menu-navegacao {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-navegacao a {
            text-decoration: none;
            color: #333;
            padding: 10px 15px;
            border-radius: 3px;
            transition: background-color 0.3s;
        }

        .menu-navegacao a:hover {
            background-color: #ddd;
        }
    </style>

<main>

    <image src="animais.jpg.jpeg" alt="Imagem de voluntariado" width="300" height="200">
        <br>
    <h2>Cadastro de Voluntário</h2>
    <form>
        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

         <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" required><br><br>

         <label for="data de nascimento">Data de Nascimento:</label><br>
        <input type="tel" id="data de nascimento" name="data de nascimento" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" required><br><br>

         <label for="endereço">Endereço:</label><br>
        <input type="tel" id="endereço" name="endereço" required><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" required><br><br>

        <label for="estado">Estado:</label><br>
        <input type="text" id="estado" name="estado"required><br><br>

        <label for="cep">CEP:</label><br>
        <input type="text" id="cep" name="cep" required><br><br>

        <label for="interesse">Área de Interesse:</label><br>
        <select id="interesse" name="interesse" required>
            <option value="resgate">Resgate de Animais</option>
            <option value="cuidados">Cuidados e Adoção</option>
            <option value="eventos">Organização de Eventos</option>
            <option value="divulgacao">Divulgação e Mídias Sociais</option>
        </select><br><br>

        <input type="submit" value="Enviar">
    </form>
</main>
